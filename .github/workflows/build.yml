name: Build Module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Rakit modul KernelSU (APK + WebUI jadi 1 zip)
        run: |
          mkdir -p module-out/apk
          cp -r ksu-module/. module-out/
          cp app/build/outputs/apk/debug/app-debug.apk module-out/apk/DailyTools.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DailyTools-Module
          path: module-out/
